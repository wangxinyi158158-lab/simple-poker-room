<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>好友扑克牌房间</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#1f2937;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.wrap{max-width:920px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #17255412}h1{font-size:25px;margin:8px 0}h2{font-size:18px;margin:0 0 12px}.muted{color:#6b7280;font-size:14px}.line{display:flex;gap:8px;flex-wrap:wrap}input,select,button{font:inherit;border-radius:10px;padding:11px 12px;border:1px solid #d1d5db}input{min-width:0;flex:1}button{background:#2563eb;color:#fff;border:0;font-weight:700;cursor:pointer}button.secondary{background:#e5e7eb;color:#111827}button:disabled{opacity:.45}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.player{border:1px solid #e5e7eb;border-radius:12px;padding:12px}.player.me{border-color:#2563eb;background:#eff6ff}.cards{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.playing{background:white;border:1px solid #d1d5db;border-radius:7px;min-width:40px;text-align:center;padding:9px 4px;font-weight:800;font-size:17px}.red{color:#dc2626}.hidden{display:none}.pill{display:inline-block;border-radius:99px;padding:4px 9px;background:#fef3c7;font-size:12px}.status{padding:9px 12px;border-radius:10px;background:#ecfdf5;color:#047857}.danger{color:#b91c1c}@media(max-width:520px){.wrap{padding:10px}.card{padding:14px}h1{font-size:22px}}
</style></head><body><main class="wrap"><h1>🃏 好友扑克牌房间</h1><p class="muted">无需注册登录 · 手机电脑都能玩 · 同房间玩家互相可见手牌 · 积分允许为负数</p>
<section class="card" id="entry"><h2>进入房间</h2><div class="line"><input id="name" maxlength="16" placeholder="输入你的昵称"/><input id="room" maxlength="8" placeholder="房间号（留空自动生成）"/><button id="join">创建 / 加入</button></div><p class="muted">创建者把房间号发给朋友，朋友输入同一个房间号加入。房间号只需字母和数字。</p></section>
<section class="card hidden" id="game"><div class="line" style="align-items:center;justify-content:space-between"><div><h2 style="margin-bottom:4px">房间号：<span id="roomLabel"></span></h2><span class="muted">把房间号发给朋友一起玩</span></div><button class="secondary" id="copy">复制房间号</button></div><div class="line" style="margin-top:14px"><button id="ready">我准备好了</button><button id="next" class="secondary hidden">下一局 / 重新准备</button></div><p id="hint" class="muted">至少2名玩家都准备后自动发牌，每人5张。</p></section>
<section class="card hidden" id="roster"><h2>玩家与手牌</h2><div class="players" id="players"></div></section>
<section class="card hidden" id="transfer"><h2>转让积分</h2><div class="line"><select id="target"></select><input id="amount" type="number" min="1" step="1" placeholder="转让积分数量"/><button id="send">确认转让</button></div><p class="muted">转让后自己的积分可以变成负数。只能转给同房间其他玩家。</p></section>
<p id="toast" class="muted"></p></main><script>
const $=id=>document.getElementById(id);let ws=null,myId='',currentState=null,ready=false;
function toast(t){$('toast').textContent=t;setTimeout(()=>{if($('toast').textContent===t)$('toast').textContent=''},4000)}
function makeCode(){return Math.random().toString(36).slice(2,7).toUpperCase()}
$('join').onclick=()=>{const name=$('name').value.trim()||'玩家';let room=$('room').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);if(!room)room=makeCode();if(ws)ws.close();const proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(`${proto}//${location.host}/ws?room=${encodeURIComponent(room)}&name=${encodeURIComponent(name)}`);$('join').disabled=true;ws.onopen=()=>{ $('entry').classList.add('hidden');$('game').classList.remove('hidden');$('roster').classList.remove('hidden');$('transfer').classList.remove('hidden');$('roomLabel').textContent=room;toast('已连接房间');};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='welcome'){myId=m.id;render(m.state)}if(m.type==='state')render(m.state);if(m.type==='notice')toast(m.text)};ws.onerror=()=>toast('连接出错，请刷新页面重试');ws.onclose=()=>{ $('join').disabled=false;toast('连接已断开，请重新进入房间')};};
function send(m){if(ws&&ws.readyState===1)ws.send(JSON.stringify(m));else toast('尚未连接房间')}
$('ready').onclick=()=>{ready=!ready;send({type:'ready',value:ready});$('ready').textContent=ready?'取消准备':'我准备好了'};
$('next').onclick=()=>{ready=false;$('ready').textContent='我准备好了';send({type:'next'})};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('roomLabel').textContent);toast('房间号已复制')}catch{toast('请手动记下房间号：'+$('roomLabel').textContent)}};
$('send').onclick=()=>{const to=$('target').value,amount=Number($('amount').value);if(!to){toast('请选择要接收积分的玩家');return}if(!Number.isInteger(amount)||amount<=0){toast('请输入大于0的整数');return}send({type:'transfer',to,amount});$('amount').value=''};
function render(s){currentState=s;$('roomLabel').textContent=s.code;$('hint').textContent=s.players.length<2?'等待其他玩家加入（至少需要2人）。':s.started?'本局已发牌！所有玩家都能看到彼此的5张牌。':'所有玩家点击准备后自动发牌。';$('ready').disabled=s.started;$('next').classList.toggle('hidden',!s.started);$('players').innerHTML='';for(const p of s.players){const d=document.createElement('div');d.className='player'+(p.id===myId?' me':'');const h=p.hand||[];d.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px"><strong></strong><span class="pill"></span></div><div>积分：<strong class="score"></strong></div><div class="muted state"></div><div class="cards"></div>`;d.querySelector('strong').textContent=p.name+(p.id===myId?'（我）':'');d.querySelector('.pill').textContent=p.ready?'已准备':'未准备';d.querySelector('.score').textContent=p.score;d.querySelector('.state').textContent=s.started?'本局手牌：':'等待发牌';const cards=d.querySelector('.cards');h.forEach(c=>{const x=document.createElement('span');x.className='playing '+('♥♦'.includes(c.suit)?'red':'');x.textContent=c.rank+c.suit;cards.appendChild(x)});$('players').appendChild(d)}const target=$('target');const old=target.value;target.innerHTML='';s.players.filter(p=>p.id!==myId).forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name+'（'+p.score+'分）';target.appendChild(o)});if([...target.options].some(o=>o.value===old))target.value=old;$('send').disabled=target.options.length===0;}
</script></body></html>
